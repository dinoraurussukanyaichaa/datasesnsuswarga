<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sensus Ekonomi Penduduk</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 25px; text-align: center; }
        header h2 { color: #1a202c; font-size: 28px; margin-bottom: 5px; }
        header p { color: #718096; font-size: 14px; }

        /* Chart Section */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-card h3 { font-size: 16px; color: #4a5568; margin-bottom: 15px; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }

        /* Controls Section */
        .controls-card { background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
        .inputs-group { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
        input, select { padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: #3182ce; }
        
        .btn-sync { padding: 10px 20px; background: #3182ce; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-sync:hover { background: #2b6cb0; }

        /* Table Section */
        .table-card { background: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #2d3748; color: #fff; padding: 14px 16px; font-size: 14px; font-weight: 600; }
        td { padding: 14px 16px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        tbody tr { cursor: pointer; transition: background 0.15s; }
        tbody tr:hover { background-color: #f7fafc; }

        /* Status Badge */
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-milik { background: #c6f6d5; color: #22543d; }
        .badge-kontrak { background: #feebc8; color: #744210; }

        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 450px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.15); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 12px; margin-bottom: 15px; }
        .close-btn { font-size: 22px; cursor: pointer; color: #a0aec0; }
        .close-btn:hover { color: #2d3748; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #edf2f7; font-size: 14px; }
        .detail-row span:first-child { color: #718096; font-weight: 500; }
        .detail-row span:last-child { font-weight: 600; color: #2d3748; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>Dashboard Sensus Ekonomi Penduduk</h2>
            <p>Visualisasi Realtime & Data Lengkap Hasil Sensus</p>
        </header>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Distribusi Status Kepemilikan Rumah</h3>
                <canvas id="statusChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Sumber Penghasilan Utama</h3>
                <canvas id="incomeChart"></canvas>
            </div>
        </div>

        <div class="controls-card">
            <div class="inputs-group">
                <input type="text" id="searchInput" placeholder="Cari Nama / NIK / Pekerjaan..." onkeyup="filterData()">
                <select id="statusFilter" onchange="filterData()">
                    <option value="">Semua Status Rumah</option>
                    <option value="milik pribadi">Milik Pribadi</option>
                    <option value="kontrak">Kontrak</option>
                </select>
            </div>
            <button class="btn-sync" onclick="loadApifyData()">Sync Data Apify</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>NIK</th>
                        <th>Nama Lengkap</th>
                        <th>Sumber Penghasilan</th>
                        <th>Jml Keluarga</th>
                        <th>Status Rumah</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" style="text-align:center; color:#a0aec0;">Klik "Sync Data Apify" atau tunggu muat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detail Data Penduduk</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const APIFY_TOKEN = 'apify_api_exbZFhJiVVas9rWYymnRcgXfsKXAYT2WESIX';
        const DATASET_ID = 'GANTI_DENGAN_DATASET_ID_APIFY'; 

        let globalData = [];
        let statusChartInstance = null;
        let incomeChartInstance = null;

        async function loadApifyData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#718096;">Mengambil data dari Apify...</td></tr>`;

            const url = `https://api.apify.com/v2/datasets/${DATASET_ID}/items?token=${APIFY_TOKEN}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Gagal mengambil data. Pastikan DATASET_ID valid.');
                
                globalData = await response.json();
                renderTable(globalData);
                updateCharts(globalData);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#e53e3e;">Error: ${error.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#a0aec0;">Data tidak ditemukan.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const status = (item.status_rumah || '').toLowerCase();
                const statusClass = status === 'milik pribadi' ? 'badge-milik' : 'badge-kontrak';

                const tr = document.createElement('tr');
                tr.onclick = () => showDetail(item);
                tr.innerHTML = `
                    <td>${item.nik || '-'}</td>
                    <td><strong>${item.nama_lengkap || '-'}</strong></td>
                    <td>${item.sumber_penghasilan || '-'}</td>
                    <td>${item.jumlah_keluarga || 0} Orang</td>
                    <td><span class="badge ${statusClass}">${item.status_rumah || '-'}</span></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function showDetail(item) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-row"><span>NIK</span><span>${item.nik || '-'}</span></div>
                <div class="detail-row"><span>Nama Lengkap</span><span>${item.nama_lengkap || '-'}</span></div>
                <div class="detail-row"><span>Alamat</span><span>${item.alamat || '-'}</span></div>
                <div class="detail-row"><span>Jumlah Anggota Keluarga</span><span>${item.jumlah_keluarga || 0} Orang</span></div>
                <div class="detail-row"><span>Sumber Penghasilan Utama</span><span>${item.sumber_penghasilan || '-'}</span></div>
                <div class="detail-row"><span>Jumlah Kendaraan</span><span>${item.jumlah_kendaraan || 0} Unit</span></div>
                <div class="detail-row"><span>Jumlah Rumah</span><span>${item.jumlah_rumah || 0} Unit</span></div>
                <div class="detail-row"><span>Status Rumah</span><span>${item.status_rumah || '-'}</span></div>
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const statusValue = document.getElementById('statusFilter').value.toLowerCase();

            const filtered = globalData.filter(item => {
                const matchSearch = (item.nama_lengkap || '').toLowerCase().includes(searchValue) ||
                                    (item.nik || '').toLowerCase().includes(searchValue) ||
                                    (item.sumber_penghasilan || '').toLowerCase().includes(searchValue);
                
                const matchStatus = statusValue === '' || (item.status_rumah || '').toLowerCase() === statusValue;

                return matchSearch && matchStatus;
            });

            renderTable(filtered);
            updateCharts(filtered);
        }

        function updateCharts(data) {
            // Count Status Rumah
            const statusCounts = {};
            // Count Penghasilan
            const incomeCounts = {};

            data.forEach(item => {
                const status = item.status_rumah || 'Lainnya';
                const income = item.sumber_penghasilan || 'Lainnya';
                
                statusCounts[status] = (statusCounts[status] || 0) + 1;
                incomeCounts[income] = (incomeCounts[income] || 0) + 1;
            });

            // Destroy existing charts before re-render
            if (statusChartInstance) statusChartInstance.destroy();
            if (incomeChartInstance) incomeChartInstance.destroy();

            // Doughnut Chart - Status Rumah
            const ctxStatus = document.getElementById('statusChart').getContext('2d');
            statusChartInstance = new Chart(ctxStatus, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#48bb78', '#ecc94b', '#4299e1', '#ed8936']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            // Bar Chart - Penghasilan
            const ctxIncome = document.getElementById('incomeChart').getContext('2d');
            incomeChartInstance = new Chart(ctxIncome, {
                type: 'bar',
                data: {
                    labels: Object.keys(incomeCounts),
                    datasets: [{
                        label: 'Jumlah Penduduk',
                        data: Object.values(incomeCounts),
                        backgroundColor: '#3182ce'
                    }]
                },
                options: { 
                    responsive: true, 
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }
    </script>
</body>
</html>
